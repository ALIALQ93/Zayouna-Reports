<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تقرير تصنيف المصاريف والعقود — دار زيونة</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#1e2a5e; --navy2:#28377a; --maroon:#9b2242; --gold:#c9a227;
  --ink:#1b2333; --muted:#667085; --line:#e4e8f0; --bg:#eef1f6;
  --green:#1f7a54; --greenbg:#e7f4ee; --amber:#8a5a12; --amberbg:#fbf3e4;
  --paper:#fff;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font-family:"Cairo","Segoe UI",Tahoma,sans-serif;background:var(--bg);color:var(--ink);line-height:1.55}
button,input{font-family:inherit}
.wrap{max-width:1180px;margin:0 auto;padding:22px 16px 48px}
.sheet{background:var(--paper);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.head{background:var(--navy);color:#fff;padding:22px 26px 18px;display:flex;justify-content:space-between;gap:18px;align-items:flex-end;flex-wrap:wrap}
.head h1{margin:0;font-size:26px;font-weight:800;letter-spacing:0}
.head .kicker{margin:0 0 6px;color:var(--gold);font-weight:700;font-size:13px}
.head p{margin:6px 0 0;color:#d5dbed;font-size:13.5px}
.head .meta{text-align:left;font-size:12.5px;color:#d5dbed;font-weight:600}
.head .meta b{display:block;color:#fff;font-size:15px;margin-bottom:2px}
.nav{display:flex;gap:6px;padding:10px 14px;background:#f7f8fc;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;overflow:auto}
.nav button,.subs button{border:0;background:transparent;color:var(--navy);font-weight:700;font-size:14px;padding:8px 14px;border-radius:999px;cursor:pointer;white-space:nowrap}
.nav button[aria-selected="true"]{background:var(--navy);color:#fff}
.panel{padding:20px 22px 28px}
.subs{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0}
.subs button{background:#fff;border:1px solid var(--line);font-size:13px}
.subs button[aria-selected="true"]{background:#eef2fb;border-color:var(--navy);color:var(--navy)}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-bottom:18px}
.kpi{border:1px solid var(--line);border-radius:12px;padding:14px 14px 12px;background:#fff}
.kpi .lbl{font-size:12px;color:var(--muted);font-weight:700}
.kpi .val{margin-top:6px;font-size:22px;font-weight:800;color:var(--navy);direction:ltr;text-align:right;font-variant-numeric:tabular-nums}
.kpi .unit{font-size:11.5px;color:var(--muted);font-weight:600}
.kpi.fee .val{color:var(--amber)}
.kpi.contract .val{color:var(--maroon)}
.kpi.total{background:#f4f7fb}
h2{margin:8px 0 6px;font-size:18px;color:var(--navy)}
h3{margin:18px 0 8px;font-size:15px;color:var(--navy)}
.lead{margin:0 0 14px;color:var(--muted);font-size:13.5px}
.grid2{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;align-items:start}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);vertical-align:top}
th{text-align:right;font-size:12px;color:var(--navy);background:#f4f7fb;font-weight:800;position:sticky;top:0}
td.num,th.num{direction:ltr;text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.scroll{max-height:68vh;overflow:auto;border:1px solid var(--line);border-radius:12px}
.bars{display:flex;flex-direction:column;gap:9px}
.bar .top{display:flex;justify-content:space-between;gap:10px;font-size:13px;font-weight:700}
.bar .top span:last-child{direction:ltr;font-variant-numeric:tabular-nums;color:var(--muted);font-weight:600}
.track{height:8px;background:#eef1f6;border-radius:99px;margin-top:4px;overflow:hidden}
.fill{height:100%;background:var(--navy);border-radius:99px}
.fill.cعقود{background:var(--maroon)}
.fill.cمواد{background:var(--green)}
.fill.cأعمال{background:var(--navy)}
.fill.cنقل{background:var(--gold)}
.fill.cمختلط{background:#7b8494}
.fill.cغير{background:#b5730f}
.tools{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin:8px 0 12px}
.tools input{flex:1;min-width:220px;border:1px solid var(--line);border-radius:10px;padding:9px 12px;font-size:14px}
.tools .stat{font-size:13px;font-weight:700;color:var(--navy)}
.brief{border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:8px 0 14px;background:#f8f9fc}
.brief h3{margin:0 0 6px}
.brief ul{margin:8px 0 0;padding-inline-start:18px}
.brief li{margin:3px 0}
.tag{display:inline-block;border-radius:99px;padding:1px 8px;font-size:12px;font-weight:700;background:#eef2fb;color:var(--navy)}
tr.neg td.num{color:var(--maroon)}
@media(max-width:860px){
  .kpis,.grid2{grid-template-columns:1fr}
  .head h1{font-size:22px}
  .kpi .val{font-size:18px}
}
@media print{
  body{background:#fff}
  .nav,.subs,.tools{display:none}
  .wrap{max-width:none;padding:0}
  .sheet{border:0}
  .scroll{max-height:none;overflow:visible;border:0}
}
</style>
</head>
<body>
<div class="wrap">

</div>

function secondary(l){
  if(l.cat==="أعمال"){
    if(l.note==="سلفة"||l.note==="عربون"||l.note.startsWith("سلفة")) return "سلف وعربون";
    if(l.note==="دفعة") return "دفعات";
    return "تنفيذ";
  }
  if(l.cat==="عقود") return l.note==="تنفيذ" ? "تسديد" : "دفعات";
  if(l.cat==="مواد"){
    if(l.note==="تخفيض") return "تخفيض";
    if(l.note==="دفعة كاملة") return "كونكريت";
    if(l.note==="شراء مع نقل") return "شراء مع نقل";

}

function fmt(n){
  const x = Math.round(Number(n)||0);

}
function money(l){

      ["بورسلين", ["بورسلين","سيراميك","سراميك"]],
      ["عزل", ["عزل","عازل","زفت","لباد","فوم","غشاء","فلانكوت","نايلون","وتر ستوب"]],
      ["كهرباء", ["كهرب","كيبل","سلك","واير","بورد","كاميرا","كاميرة"]],
      ["صحي", ["صحي","مجاري","خلاط","خزان","حنفي","صنبور"]],
      ["طابوق", ["طابوق","بلوك","كواني","شتايكر"]],
      ["اسمنت ورمل", ["اسمنت","أسمنت","سمنت","رمل","حصى","جلمود","سبيس"]],
      ["خشب", ["خشب","بلايوود","معاكس"]],
      ["لاصق", ["لاصق","اسكبي"]],
      ["حجر ومرمر", ["حجر","مرمر","كوسرة","رخام"]],
      ["تربة", ["تربة"]],
      ["مضخات", ["غطاس","ماطور","مضخ"]],
      ["مواد إنشائية", ["إنشائ","انشائ","سكلة","قائمة مواد","فرق قائمة"]]
    ];
    for(const [name, keys] of mats) if(has(t, keys)) return name;
    return "مواد متفرقة";
  }
  if(l.cat==="أعمال"){
    const jobs = [
      ["كهرباء", ["كهرب","إبراهيم","ابراهيم"]],
      ["حدادة وتسليح", ["حداد","حدادة","تسليح","لحام","بليت","حديد"]],
      ["نجارة", ["نجار","نجارة"]],
      ["بورسلين", ["بورسلين","جليل"]],
      ["عزل", ["عزل"]],
      ["حراسة", ["حارس","حراس"]],
      ["مساحة", ["مساح","مساحة"]],
      ["تنظيف", ["تنظيف"]],
      ["حفر", ["حفر","حفارة"]],
      ["تسطيح", ["تسطيح","تغليف السطح","أبو يوسف","ابو يوسف"]],
      ["بياض", ["بياض","مبيض","أبو كاظم","ابو كاظم"]],
      ["حجارة", ["حجار","حجارة"]],
      ["ركائز", ["ركانز","ركائز","العامري"]],
      ["مسبح", ["مسبح"]],
      ["ديكور", ["ديكور","سلابات"]],
      ["هدم", ["هدم"]],
      ["تبريد", ["تبريد","درين"]],
      ["صب", ["صب","هزاز","كونكر"]],
      ["بناء", ["بناء","خلفة","لبخ","طابوق","مرتج"]],
      ["صحي", ["صحي","مجاري","غطاس"]]
    ];
    for(const [name, keys] of jobs) if(has(t, keys)) return name;
    return "أعمال أخرى";
  }
  if(l.cat==="نقل"){
    if(has(t, ["أنقاض","انقاض"])) return "أنقاض";
    if(has(t, ["تنكر","ماء"])) return "ماء";
    if(has(t, ["عمال","تكسي"])) return "عمال";
    return "نقل مواد";
  }
  if(l.cat==="مختلط"){
    if(has(t, ["صب","هزاز"])) return "صب مع نقل";
    if(has(t, ["تنزيل","أنقاض","انقاض"])) return "تنزيل مع نقل";
    return "أجر مع نقل";
  }
  if(has(t, ["كهرب","ماء الدولة"])) return "فواتير";
  if(t.includes("صرف")) return "صرفيات";
  if(!t.trim()) return "بلا وصف";
  return "غير مفصول";
}
function place(l){
  const t = l.desc;
  const rules = [
    ["المسبح", ["مسبح","مسابح"]],
    ["المصعد", ["مصعد","مصاعد"]],
    ["السرداب", ["سرداب"]],
    ["الأساس", ["أساس","اساس"]],
    ["السطح", ["سطح","بيتونة"]],
    ["الواجهة", ["واجهة","أقواس","اقواس"]],
    ["الطابق الثاني", ["طابق الثاني","الطابق الثاني"]],
    ["الطابق الأول", ["طابق الأول","الطابق الأول","طابق الاول","الطابق الاول"]],
    ["الطابق الأرضي", ["طابق الأرض","الطابق الأرض","طابق الارضي","الارضي"]],
    ["الدار الأول", ["الدار الأول","الدار الاول"]],
    ["الدار الثاني", ["الدار الثاني"]],
    ["الدار الأيمن", ["ايمن","أيمن"]],
    ["الدار الأيسر", ["ايسر","أيسر"]],
    ["الحمامات", ["حمام"]],
    ["الآبار", ["آبار","ابار","بئر"]],
    ["السياج", ["سياج"]],
    ["التربة", ["تربة"]]
  ];
  const hits = rules.filter((pair)=>has(t, pair[1])).map((pair)=>pair[0]);
  return hits.length ? hits.join(" · ") : "غير محدد في النص";
}
function groups(cat){
  const map = new Map();
  LINES.filter(l=>l.cat===cat).forEach(l=>{
    const k = topic(l);
    map.set(k, (map.get(k)||0)+l.amount);
  });
  return [...map.entries()].sort((a,b)=>b[1]-a[1]);
}

let main = "الملخص";
let sub = "الكل";
let q = "";

function setMain(name){
  main = name;
  sub = name==="عقود" ? "التبريد" : "الكل";
  q = "";
  history.replaceState(null, "", "#"+encodeURIComponent(name));
  draw();
}
function drawNav(){
  document.getElementById("nav").innerHTML = TABS.map(t=>
    `<button type="button" aria-selected="${t===main}" data-tab="${esc(t)}">${esc(t)}</button>`
  ).join("");
  document.getElementById("nav").onclick = (e)=>{
    const b = e.target.closest("button");
    if(b) setMain(b.dataset.tab);
  };
}
function table(headers, rows, numeric){
  const th = headers.map((h,i)=>`<th class="${numeric.includes(i)?"num":""}">${esc(h)}</th>`).join("");
  const body = rows.map(r=>{
    const neg = r.some(c=>typeof c==="number" && c<0);
    const tds = r.map((c,i)=>{
      const num = numeric.includes(i);
      const text = num && typeof c==="number" ? fmt(c) : esc(c);
      return `<td class="${num?"num":""}">${text}</td>`;
    }).join("");
    return `<tr class="${neg?"neg":""}">${tds}</tr>`;
  }).join("");
  return `<div class="scroll"><table><thead><tr>${th}</tr></thead><tbody>${body}</tbody></table></div>`;
}
function bars(){
  return `<div class="bars">${CATS.map(c=>{
    const v = sumCat(c);
    const pct = (v/ALL*100).toFixed(1);
    const cls = c==="غير مصنف" ? "غير" : c;
    return `<div class="bar"><div class="top"><span>${esc(c)}</span><span>${fmt(v)} · ${pct}%</span></div><div class="track"><div class="fill c${cls}" style="width:${pct}%"></div></div></div>`;
  }).join("")}</div>`;
}

function visibleLines(cat){
  const query = q.trim();
  return LINES.filter(l=>l.cat===cat && (sub==="الكل" || topic(l)===sub)).filter(l=>{
    if(!query) return true;
    return `${l.kashf} ${l.date} ${l.desc} ${l.note} ${topic(l)} ${place(l)}`.includes(query);
  }).sort((a,b)=>a.kashf-b.kashf || a.date.localeCompare(b.date));
}
function fillLines(cat){
  const shown = visibleLines(cat);
  const shownSum = shown.reduce((a,l)=>a+l.amount,0);
  document.getElementById("countline").textContent = shown.length+" بند · "+fmt(shownSum)+" د.ع";
  document.getElementById("list").innerHTML = shown.map(l=>`<tr>
    <td>${l.kashf}</td><td>${esc(l.date)}</td><td>${esc(l.desc)}</td>
    <td class="num">${esc(money(l))}</td><td><span class="tag">${esc(topic(l))}</span></td>
    <td>${esc(place(l))}</td><td>${esc(l.note)}</td>
  </tr>`).join("") || `<tr><td colspan="7">لا توجد بنود مطابقة.</td></tr>`;
}
function category(cat){
  const gs = groups(cat);
  const total = gs.reduce((a,[,n])=>a+n,0);
  const subs = ["الكل", ...gs.map(([n])=>n)];
  const phrase = gs.length===1?"تصنيف فرعي واحد":gs.length===2?"تصنيفان فرعيان":gs.length<=10?gs.length+" تصنيفات فرعية":gs.length+" تصنيفاً فرعياً";
  return `
    <h2>${esc(cat)}</h2>
    <p class="lead">${fmt(total)} دينار · ${phrase}. مكان الاستخدام يُذكر فقط إذا ورد في نص البند.</p>
    <div class="subs" id="subs">${subs.map(s=>`<button type="button" aria-selected="${s===sub}" data-sub="${esc(s)}">${esc(s)}</button>`).join("")}</div>
    ${table(["التصنيف الفرعي","المبلغ","الحصة"], gs.map(([n,v])=>[n,v,(v/total*100).toFixed(1)+"%"]), [1])}
    <div class="tools">
      <input id="q" type="search" placeholder="بحث في الكشف أو الوصف أو المكان" value="${esc(q)}">
      <div class="stat" id="countline"></div>
    </div>
    <div class="scroll"><table>
      <thead><tr><th>الكشف</th><th>التاريخ</th><th>صيغة الصرف</th><th class="num">المبلغ</th><th>التصنيف</th><th>مكان الاستخدام</th><th>ملاحظة</th></tr></thead>

}

function draw(){
  if(main==="عقود" && !["التبريد","المصاعد","خطوط الهواء"].includes(sub)) sub = "التبريد";

  const panel = document.getElementById("panel");

    const b = e.target.closest("button");

    sub = b.dataset.sub; draw();

  const input = document.getElementById("q");

draw();
